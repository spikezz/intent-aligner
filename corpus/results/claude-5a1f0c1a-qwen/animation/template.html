<title>意图提取调用回放</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a signal path read left to right (prompt -> endpoint -> reply), with the growing graph as the bench below. */
:root{--bg:#eef1f4;--panel:#fbfcfd;--ink:#16232f;--dim:#5d6c7a;--line:#c8d1da;--signal:#0b6e8a;--ok:#1f7a4d;--bad:#b3322a;--wait:#a86a00;
--T:#4656b8;--A:#a2469b;--B:#0b6e8a;--G:#a86a00;--L:#7a6a1e;--C:#1f7a4d;--D:#b3322a;--Z:#5d6c7a;
--sans:"Noto Sans SC",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171e;--panel:#18222c;--ink:#e3eaf0;--dim:#93a3b1;--line:#31404e;--signal:#4dbcd8;--ok:#58c48d;--bad:#ef7f75;--wait:#e6ac4b;--T:#99a6f2;--A:#df92d7;--B:#4dbcd8;--G:#e6ac4b;--L:#cdbb68;--C:#58c48d;--D:#ef7f75;--Z:#93a3b1;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171e;--panel:#18222c;--ink:#e3eaf0;--dim:#93a3b1;--line:#31404e;--signal:#4dbcd8;--ok:#58c48d;--bad:#ef7f75;--wait:#e6ac4b;--T:#99a6f2;--A:#df92d7;--B:#4dbcd8;--G:#e6ac4b;--L:#cdbb68;--C:#58c48d;--D:#ef7f75;--Z:#93a3b1;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--sans);padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1560px;margin:auto;display:grid;gap:12px}
h1{font-size:21px;margin:0;font-weight:700}
.sub{color:var(--dim);margin:2px 0 0;max-width:80ch}
.mono{font-family:var(--mono)}
.rail{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stop{font-size:13px;padding:3px 10px;border:1px solid var(--line);border-radius:3px;color:var(--dim);background:var(--panel)}
.stop.on{color:var(--panel);background:var(--signal);border-color:var(--signal)}
.arrow{color:var(--dim)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{font:13px var(--sans);padding:5px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:3px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
#play{background:var(--signal);border-color:var(--signal);color:var(--panel);min-width:66px}
#scrub{flex:1 1 200px;min-width:0;accent-color:var(--signal)}
#count{font:13px var(--mono);color:var(--dim);font-variant-numeric:tabular-nums}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline}
.badge{font:500 15px var(--mono);padding:2px 10px;color:var(--panel);border-radius:3px;background:var(--Z)}
.ftitle{font-size:18px;font-weight:700;min-width:0}
.meta{color:var(--dim);font-size:13px}
.unit{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px 12px;overflow-wrap:anywhere}
.unit b{font-weight:500;color:var(--dim);margin-right:8px}
.stage{display:grid;grid-template-columns:minmax(0,1.45fr) 104px minmax(0,1.1fr) minmax(0,1.1fr);gap:0;align-items:stretch}
.col{max-height:680px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 12px;min-width:0;transition:border-color .25s}
.col h2{font-size:12px;letter-spacing:.06em;color:var(--dim);margin:0 0 8px;font-weight:500}
.col.live{border-color:var(--signal)}
.part{padding:4px 8px;margin-bottom:4px;border-left:3px solid var(--line);font-size:13px;opacity:.35;transition:opacity .2s,border-color .2s;overflow-wrap:anywhere}
.part.lit{opacity:1;border-left-color:var(--signal)}
.wire{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.wire .node{width:82px;height:82px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center;text-align:center;font-size:12px;line-height:1.3;background:var(--panel);z-index:1;transition:border-color .2s}
.wire.busy .node{border-color:var(--signal);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--signal) 22%,transparent)}}
.wire::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line)}
.pkt{position:absolute;top:calc(50% - 6px);left:0;width:12px;height:12px;border-radius:50%;background:var(--signal);opacity:0;z-index:2}
.pkt.go{animation:go var(--beat) linear forwards}
.pkt.back{animation:back var(--beat) linear forwards}
@keyframes go{0%{left:0;opacity:1}100%{left:calc(50% - 6px);opacity:1}}
@keyframes back{0%{left:calc(50% - 6px);opacity:1}100%{left:calc(100% - 12px);opacity:1}}
pre{margin:0;font:12.5px/1.55 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.dim{opacity:.15;transition:opacity .25s}.dim.lit{opacity:1}
.sec{margin-bottom:12px;opacity:.4;transition:opacity .2s}.sec.lit{opacity:1}
.sec h3{font-size:12px;font-weight:700;margin:0 0 4px;color:var(--signal)}
.v{background:color-mix(in srgb,var(--wait) 24%,transparent);color:var(--wait);padding:0 3px;border-radius:2px}
.msg{font:12px/1.5 var(--mono);color:var(--dim);white-space:pre-wrap;margin-top:1px}
.entries{font:12px/1.6 var(--mono);margin:0;padding-left:16px}
.check{font-size:13px;padding:2px 0 2px 20px;position:relative;opacity:.35;transition:opacity .2s}
.check::before{content:"○";position:absolute;left:2px;color:var(--dim)}
.check.ok{opacity:1}.check.ok::before{content:"✓";color:var(--ok)}
.retry{font-size:13px;color:var(--wait);margin-top:4px}
.write{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;opacity:.25;transition:opacity .25s;overflow-wrap:anywhere}
.write.lit{opacity:1}
.write.bad{color:var(--bad)}
.bench{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 12px;min-width:0}
.bench h2{font-size:14px;margin:0;font-weight:500}
.scroller{overflow:auto;max-height:440px;margin-top:6px}
svg text{font-family:var(--sans);fill:var(--ink)}
.n rect{fill:var(--panel);stroke-width:1.4}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--dim);margin-top:6px}
.notice{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px 12px;color:var(--dim);font-size:13px}
.skip{color:var(--wait);font-size:13px}
.dagbox{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 12px;min-width:0}
.dagbox summary{font-size:14px;font-weight:500;cursor:pointer}
.dagbox p{color:var(--dim);font-size:13px;margin:6px 0;max-width:110ch}
#dag{overflow:auto;max-height:430px;margin-top:6px}
#dag svg{font-size:11px}
#dag .faint{opacity:.45}
#dag [data-f]{cursor:pointer}
#dag .dot{fill:var(--panel);stroke:var(--dim);stroke-width:1.2}
#dag .dot[data-f]{stroke:var(--ink);fill:var(--line)}
#dag .box{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
#dag .box[data-f],#dag .box.played{stroke:var(--dim)}
#dag .hot{stroke:var(--signal)!important;stroke-width:2.6!important;fill:color-mix(in srgb,var(--signal) 30%,var(--panel))!important}
#dag tspan.hot{fill:var(--signal)!important;font-weight:700;stroke:none!important}
#dag .bar{stroke:var(--wait);stroke-dasharray:6 4;stroke-width:1.4}
#dag .bartext{fill:var(--wait)}
#dag .edge{fill:none;stroke:var(--dim);stroke-width:1}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr);gap:8px}.wire{height:88px}.wire::before{display:none}.pkt{display:none}}
@media (prefers-reduced-motion:reduce){.pkt{display:none}.wire.busy .node{animation:none}*{transition:none!important}}
</style>
<main>
<header><h1>意图提取：每次 LLM 端点调用的回放</h1>
<p class="sub">动画每一步是一次对端点的请求：代码拼出 prompt，模型回答，代码校验，然后把结果放进这个单元的记录。这个单元的调用全部结束时，结果才写入存储。下面的图就是下一次调用会放进 header 的当前 topic 整张图谱。</p></header>
<nav class="rail" id="rail" aria-label="流程阶段"></nav>
<div class="controls"><button id="prev" type="button">上一次</button><button id="play" type="button">播放</button><button id="next" type="button">下一次</button>
<input id="scrub" type="range" min="0" value="0" aria-label="调用序号"><span id="count"></span>
<select id="speed" aria-label="速度"><option value="1400">慢</option><option value="800" selected>中</option><option value="350">快</option></select></div>
<details class="dagbox" open><summary>依赖图：哪些调用并行、哪些必须等前面的结果</summary><p id="dagnote"></p><div id="dag"></div></details>
<section class="head"><span class="badge" id="badge"></span><span class="ftitle" id="ftitle"></span><span class="meta" id="meta"></span></section>
<div class="unit"><b id="ulabel"></b><span id="utext"></span></div>
<section class="stage" id="stage">
<div class="col" id="c1"><h2>代码发给端点的请求：黑字是代码写死的原文，<span class="v">橙底</span>是随任务变化的部分</h2><div id="parts"></div></div>
<div class="wire" id="w1"><div class="pkt" id="pkt"></div><div class="node">Qwen 3.8<br>端点</div></div>
<div class="col" id="c2"><h2>模型的回答</h2><div id="reply"></div></div>
<div class="col" id="c3"><h2>代码校验与写入</h2><div id="checks"></div><div class="retry" id="retry"></div><div class="write" id="writes"></div><pre class="write" id="record"></pre></div>
</section>
<div class="skip" id="skip"></div>
<section class="bench"><h2 id="gtitle"></h2><div class="scroller" id="scroller"></div>
<div class="legend"><span>实线框：已写入存储</span><span>虚线框：本单元刚产生、这次提交的节点</span><span>I 用户意图 · G 工具调用的聚合 · O 观测</span></div></section>
<p class="notice" id="foot"></p>
</main>
<script>
const DATA=/*DATA*/null;
const F=DATA.frames,$=id=>document.getElementById(id);
const STOPS=[["L1","第一级压缩"],["L2","第二级压缩"],["SEG","切分用户消息"],["T","T 归 topic"],["A","A 信号意图"],["B","B 用户意图去重"],["G","G 归聚合"],["L","L 底层意图去重"],["C","C 建边"],["D","D 观测结果"]];
$("rail").innerHTML=STOPS.map(([k,v],i)=>(i?'<span class="arrow">→</span>':'')+`<span class="stop" data-k="${k}">${v}</span>`).join("");
$("scrub").max=F.length-1;
$("foot").textContent=`system、schema、校验规则和固定文字都是生成页面时从代码常量或代码原文取出的。这份回放由真实运行的落盘记录逐单元还原，目前包含 ${DATA.units} 个单元、${F.length} 次调用。模型回答按记录里的字段重建，所以内容是真实结果，但被合并的重复意图不再单独显示。每次调用在回答不合格时会带着错误原因重问：切分最多 4 次，T 最多 2 次，其他最多 3 次；用尽后这个单元标记 needs_review 并继续下一个。另外，当 prompt 超过 9,000 token 时，代码会先调用一次第二级压缩来缩短当前这一轮，这种调用的落盘记录没有对应到具体单元，所以没有放进时间线，本次运行目前发生了 ${DATA.overflow} 次。`;
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let i=0,beat=0,timer=null;
const COLS={I:60,G:400,O:740},W=270,H=54;
function clip(s,n){return s.length>n?s.slice(0,n)+"…":s}
function drawGraph(f){
  if(f.graph===undefined){$("gtitle").textContent="这一步还没有开始建图谱";$("scroller").innerHTML="";return}
  const g=DATA.graphs[f.graph];const done=f.commit&&beat>=3;
  const pending=new Set(f.pending||[]);
  const shown=g.nodes.filter(n=>!pending.has(n.id)||done||(f.call!=="T"&&beat>=3));
  $("gtitle").textContent=(g.t?`${g.t}：${g.title}`:"这个单元未归属到任何 topic")+`（${shown.length} 个节点）`;
  const y={I:0,G:0,O:0},pos={};
  shown.forEach(n=>{pos[n.id]=[COLS[n.kind],20+y[n.kind]++*(H+14)]});
  const h=20+Math.max(1,...Object.values(y))*(H+14);
  const color=k=>({I:"var(--T)",G:"var(--G)",O:"var(--D)"}[k]);
  const edges=g.edges.slice(0,done?undefined:f.edgesBefore).filter(e=>pos[e.from]&&pos[e.to]).map(e=>{const [a,b]=pos[e.from],[c,d]=pos[e.to];const l=c<a;const x1=l?a:a+W,x2=l?c+W:c,y1=b+H/2,y2=d+H/2,m=(x1+x2)/2+(a===c?60:0);
    return `<path d="M${x1} ${y1}C${m} ${y1} ${m} ${y2} ${x2} ${y2}" fill="none" stroke="var(--dim)" stroke-width="1.3"/><text x="${m}" y="${(y1+y2)/2-4}" text-anchor="middle" font-size="11">${e.relation}</text>`}).join("");
  const nodes=shown.map(n=>{const [x,yy]=pos[n.id],p=pending.has(n.id)&&!done;
    return `<g class="n"><title>${esc(n.id+" "+n.label)}</title><rect x="${x}" y="${yy}" width="${W}" height="${H}" rx="3" stroke="${color(n.kind)}" ${p?'stroke-dasharray="5 4"':""}/><text x="${x+8}" y="${yy+21}" font-size="12" font-weight="700">${n.id}</text><text x="${x+8}" y="${yy+42}" font-size="12">${esc(clip(n.label,22))}</text></g>`}).join("");
  $("scroller").innerHTML=`<svg width="1040" height="${h}" viewBox="0 0 1040 ${h}" role="img" aria-label="当前 topic 的图谱">${edges}${nodes}</svg>`;
}

const D=DATA.dag,CW=150,SVGW=Math.max(1050,CW*D.columns.length);
function buildDag(){
  const at={};F.forEach((f,k)=>{if(!(f.dag in at))at[f.dag]=k});
  const fa=id=>id in at?` data-f="${at[id]}"`:"";
  const out=[],cols=D.columns,PR=6,RH=14;
  const rows=Math.max(1,...cols.map(c=>Math.ceil(c.pairs.length/PR)));
  const y1=40,h1=rows*RH+8,bar1=y1+h1+24,y2=bar1+16,bar2=y2+44,y3=bar2+16,bar3=y3+42,y4=bar3+14;
  const bar=(y,t)=>out.push(`<line class="bar" x1="0" x2="${SVGW}" y1="${y}" y2="${y}"/><text class="bartext" x="4" y="${y-4}">${esc(t)}</text>`);
  cols.forEach((c,ci)=>{
    const x=ci*CW;
    out.push(`<text x="${x+6}" y="14" font-weight="700">第 ${ci+1} 轮</text><text x="${x+6}" y="28" class="faint">${c.pairs.length} 个工具调用</text>`);
    out.push(`<rect class="box faint" x="${x+3}" y="${y1-5}" width="${CW-8}" height="${Math.max(1,Math.ceil(c.pairs.length/PR))*RH+6}" rx="3"/>`);
    c.pairs.forEach(([id,chunks],j)=>{
      const cx=x+11+(j%PR)*23,cy=y1+Math.floor(j/PR)*RH+4;
      out.push(`<g><title>${esc(id)}：先压调用，再压结果${chunks>1?`（结果分 ${chunks} 段，逐段串行）`:chunks?"":"（没有结果）"}</title>`);
      if(chunks)out.push(`<line class="edge" x1="${cx}" y1="${cy}" x2="${cx+10}" y2="${cy}"/>`);
      out.push(`<circle class="dot" data-id="p:${id}:c"${fa(`p:${id}:c`)} cx="${cx}" cy="${cy}" r="3.6"/>`);
      if(chunks)out.push(`<circle class="dot" data-id="p:${id}:r"${fa(`p:${id}:r`)} cx="${cx+10}" cy="${cy}" r="${chunks>1?4.6:3.6}" ${chunks>1?'stroke-width="2.4"':""}/>`);
      out.push(`</g>`);
    });
    if(c.round){
      out.push(`<path class="edge" d="M${x+CW/2} ${y1+Math.ceil(c.pairs.length/PR)*RH+1}V${y2}"/>`);
      out.push(`<rect class="box" data-id="r:${ci}"${fa(`r:${ci}`)} x="${x+14}" y="${y2}" width="${CW-30}" height="22" rx="3"/><text x="${x+22}" y="${y2+15}" pointer-events="none">L2 第 ${ci+1} 轮</text>`);
    }
    for(let back=1;back<=D.window;back++){const pc=ci-back;if(pc<0||!cols[pc].round)continue;
      const sx=pc*CW+CW/2,ex=x+20;out.push(`<path class="edge faint" d="M${sx} ${y2+22}C${sx} ${y3-8} ${ex} ${y2+40} ${ex} ${y3}"/>`)}
    for(let k=0;k<c.segments;k++){const sx=x+8+k*40;
      if(k)out.push(`<line class="edge" x1="${sx-10}" y1="${y3+10}" x2="${sx}" y2="${y3+10}"/>`);
      out.push(`<rect class="box" data-id="s:${ci}:${k}"${fa(`s:${ci}:${k}`)} x="${sx}" y="${y3}" width="30" height="20" rx="3"/><text x="${sx+6}" y="${y3+14}" pointer-events="none">段${k+1}</text>`)}
  });
  bar(bar1,"全部第一级任务结束后，第二级压缩才开始（compress.py 先后两次 _run_jobs）");
  bar(bar2,`compress 命令结束后才运行 segment；每条消息的窗口读它前面 ${D.window} 轮的第二级压缩（细线）`);
  bar(bar3,"segment 命令结束后才运行 extract；下面的单元严格一个接一个，每个单元读前面单元写好的图谱");
  const units=cols.flatMap((c,ci)=>c.units.map(u=>[ci,...u])),PER=8,BW=118,BH=26,GX=12,GY=18;
  units.forEach(([ci,n,calls],k)=>{
    const ux=(k%PER)*(BW+GX)+2,uy=y4+Math.floor(k/PER)*(BH+GY);
    if(k%PER)out.push(`<line class="edge" x1="${ux-GX}" y1="${uy+BH/2}" x2="${ux}" y2="${uy+BH/2}"/>`);
    else if(k)out.push(`<path class="edge" d="M${(PER-1)*(BW+GX)+2+BW/2} ${uy-GY}V${uy-GY/2}H${ux+BW/2}V${uy}"/>`);
    const letters=calls.map(([c],j)=>`<tspan data-id="u:${n}:${j}">${esc(c)}</tspan>`).join('<tspan class="faint">→</tspan>');
    out.push(`<g data-unit="${n}"><rect class="box played" data-f="${calls[0][1]}" x="${ux}" y="${uy}" width="${BW}" height="${BH}" rx="3"/><text x="${ux+6}" y="${uy+17}" pointer-events="none"><tspan class="faint">${n}·轮${ci+1} </tspan>${letters}</text></g>`);
  });
  const h=y4+Math.ceil(Math.max(1,units.length)/PER)*(BH+GY);
  $("dag").innerHTML=`<svg width="${SVGW}" height="${h}" viewBox="0 0 ${SVGW} ${h}" role="img" aria-label="调用依赖图">${out.join("")}</svg>`;
  $("dag").onclick=e=>{const t=e.target.closest("[data-f]");if(t)go(+t.dataset.f)};
  const pairs=cols.reduce((a,c)=>a+c.pairs.length,0),multi=cols.reduce((a,c)=>a+c.pairs.filter(p=>p[1]>1).length,0),segs=cols.reduce((a,c)=>a+c.segments,0);
  $("dagnote").textContent=`第一级压缩：${pairs} 个工具调用各是一个任务，${D.l1Total} 次压缩在这些任务里完成。任务内部是串行的：先压调用，再压结果，因为压结果的 prompt 要带上调用的意图；其中 ${multi} 个结果太长，被分成几段逐段压（粗圈）。任务之间互不依赖，8 个线程并行。第二级压缩要等全部第一级任务结束才开始，${cols.filter(c=>c.round).length} 轮各是一个任务，也是 8 路并行。切分在 compress 命令之后运行：${cols.filter(c=>c.segments).length} 条用户消息并行，一共切出 ${segs} 段；同一条消息里的段只能按指针顺序一段接一段地切，因为下一段从上一段的结尾开始。主循环在切分之后运行：${units.length} 个单元严格串行，单元内部的调用也串行（T→B→C、T→G→L…→C、工具结果只调 D）。点图里实心的点或框可以跳到对应的那次调用；空心的点是这次回放没有播放的调用。`;
}
function hotDag(f){
  document.querySelectorAll("#dag .hot").forEach(e=>e.classList.remove("hot"));
  const el=document.querySelector(`#dag [data-id="${f.dag}"]`);if(!el)return;el.classList.add("hot");
  const unit=el.closest("[data-unit]");if(unit)unit.querySelector("rect").classList.add("hot");
  const pane=$("dag"),b=(el.tagName==="tspan"?unit:el).getBoundingClientRect(),v=pane.getBoundingClientRect();
  if(b.top<v.top||b.bottom>v.bottom)pane.scrollTop+=b.top-v.top-v.height/2;
  if(b.left<v.left||b.right>v.right)pane.scrollLeft+=b.left-v.left-v.width/2;
}
function draw(){
  const f=F[i];
  $("scrub").value=i;$("count").textContent=`第 ${i+1} / ${F.length} 次调用`;
  document.querySelectorAll(".stop").forEach(s=>{const k=s.dataset.k;s.classList.toggle("on",k===f.phase||k===f.call)});
  const b=$("badge");b.textContent=f.call;b.style.background=`var(--${"TABGLCD".includes(f.call)&&f.call.length===1?f.call:"Z"})`;
  $("ftitle").textContent=f.title;
  $("meta").textContent=f.topic?`${f.topic}`:"";
  $("ulabel").textContent=f.unitLabel||"输入";$("utext").textContent=f.unit;
  const sp=f.spec?DATA.specs[f.spec]:null,lit=b=>beat>=b?"lit":"";
  const sec=(h,body)=>`<div class="sec lit"><h3>${esc(h)}</h3>${body}</div>`;
  const tpl=p=>p.map(([k,x])=>k==="v"?`<span class="v">${esc(x)}</span>`:esc(x)).join("");
  $("parts").innerHTML=sp?[
    sec("HTTP 请求体（发往 Hive 网关的 chat completions）",`<pre>${esc(DATA.common.request)}</pre>`),
    sec("system 消息全文",`<pre>${esc(sp.system)}</pre>`),
    sec("user 消息",`<pre>${tpl(sp.user)}</pre>`),
    sec("上下文窗口的固定规则",`<div class="msg">${esc(DATA.common.budget)}</div><ul class="entries">${DATA.common.entries.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`)
  ].join(""):`<p>这个单元不需要模型判断，代码直接处理。</p>`;
  $("reply").innerHTML=sp?`<div class="sec lit"><h3>response_format 的 JSON schema 全文（代码写死）</h3><pre>${esc(JSON.stringify(sp.schema,null,1))}</pre></div><div class="dim ${lit(2)}"><h3 style="font-size:12px;margin:0 0 4px;color:var(--signal)">这次的回答（由落盘记录还原）</h3><pre>${esc(JSON.stringify(f.reply,null,1))}</pre></div>`:"";
  $("checks").innerHTML=sp?`<div class="msg">schema 校验：回答必须是合法 JSON 并符合左边的 schema。</div>`+sp.checks.map(([c,m])=>`<div class="check ${beat>=3?"ok":""}">${esc(c)}<div class="msg">不通过时发给模型：${esc(m)}</div></div>`).join("")+`<div class="sec lit" style="margin-top:8px"><h3>重问时追加到 prompt 末尾的固定文字（最多调用 ${sp.limit} 次）</h3>${sp.feedback.map(([c,m])=>`<div class="msg">${esc(c)}：${esc(m)}</div>`).join("")}</div>`:"";
  $("retry").textContent=f.attempts>1&&beat>=3?`这次一共调用了 ${f.attempts} 次：前面的回答没有通过校验，代码把错误原因附在 prompt 末尾重问。`:"";
  const w=$("writes");w.innerHTML=(f.fail?[`needs_review：${f.fail}`]:[]).concat(f.writes,(f.log||[]).map(l=>"run.log 写入："+l)).map(esc).join("<br>");w.classList.toggle("lit",beat>=3);w.classList.toggle("bad",!!f.fail&&beat>=3);
  const rec=$("record");rec.textContent=f.record?"实际写入的这一行：\n"+JSON.stringify(f.record,null,1):"";rec.classList.toggle("lit",beat>=3);
  $("skip").textContent=f.skip&&beat>=3?f.skip:"";
  $("c1").classList.toggle("live",beat===0);$("c2").classList.toggle("live",beat===2);$("c3").classList.toggle("live",beat===3);
  $("w1").classList.toggle("busy",beat===1&&!!sp);
  const p=$("pkt");p.className="pkt";void p.offsetWidth;if(sp&&beat===1)p.classList.add("go");if(sp&&beat===2)p.classList.add("back");
  document.documentElement.style.setProperty("--beat",$("speed").value+"ms");
  drawGraph(f);hotDag(f);
}
function stop(){clearTimeout(timer);timer=null;$("play").textContent="播放"}
function tick(){beat++;if(beat>3){if(i>=F.length-1){stop();beat=3;draw();return}i++;beat=0}draw();timer=setTimeout(tick,+$("speed").value)}
function go(n){stop();i=Math.max(0,Math.min(F.length-1,n));beat=3;draw()}
$("play").onclick=()=>{if(timer)return stop();if(i>=F.length-1&&beat>=3){i=0;beat=0;draw()}$("play").textContent="暂停";timer=setTimeout(tick,+$("speed").value)};
$("prev").onclick=()=>go(i-1);$("next").onclick=()=>go(i+1);$("scrub").oninput=e=>go(+e.target.value);
buildDag();beat=3;draw();
</script>
