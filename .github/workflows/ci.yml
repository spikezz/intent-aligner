name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy intent_aligner tests
      - name: Test
        # The corpus tests skip without a built corpus and the live LLM tests skip
        # without INTENT_ALIGNER_LIVE=1, so CI runs the offline suite only.
        run: pytest -q
