<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Replay</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #d9d9d4;
  --l1: #3b7dd8; --l2: #7a5cc7; --seg: #d08a1e; --loop: #2f9e6a;
  --ok: #2f9e6a; --bad: #d1453b; --warn: #d08a1e; --pending: #c9c9c3; --active: #111111;
  --feedback: #fde7c4; --code: #f1f1ee;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a09f98; --line: #3a3a36;
    --pending: #4a4a45; --active: #ffffff; --feedback: #5a4318; --code: #262624;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a09f98; --line: #3a3a36;
  --pending: #4a4a45; --active: #ffffff; --feedback: #5a4318; --code: #262624;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, "Noto Sans CJK SC", sans-serif; }
header { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 17px; margin: 0 0 4px; }
.meta { color: var(--muted); font-size: 12px; word-break: break-all; }
.summary { margin-top: 8px; border-collapse: collapse; font-size: 12px; }
.summary td, .summary th { border: 1px solid var(--line); padding: 2px 8px; text-align: right; }
.summary th:first-child, .summary td:first-child { text-align: left; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
.controls button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 4px; padding: 3px 9px; cursor: pointer; font: inherit; }
.controls button.on { background: var(--ink); color: var(--panel); }
.controls input[type=range] { flex: 1; min-width: 160px; }
#counter { font-variant-numeric: tabular-nums; min-width: 90px; }
#strip { display: block; width: 100%; height: 34px; background: var(--panel); border-bottom: 1px solid var(--line); cursor: pointer; }
main { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 0; height: calc(100vh - 210px); min-height: 480px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } }
.pane { overflow: auto; padding: 12px 16px; border-right: 1px solid var(--line); }
#dag text { font-size: 10px; fill: var(--muted); }
#dag .band { font-size: 12px; font-weight: 600; fill: var(--ink); }
#dag .node { cursor: pointer; }
#dag .barrier { stroke: var(--line); stroke-dasharray: 4 3; }
.legend { font-size: 12px; color: var(--muted); margin: 6px 0 10px; }
.legend span { display: inline-block; width: 10px; height: 10px; margin: 0 4px 0 10px; vertical-align: -1px; border-radius: 2px; }
.frame-title { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
.badge { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 12px; color: #fff; margin-right: 4px; }
.verdict-accepted { background: var(--ok); } .verdict-rejected { background: var(--warn); } .verdict-failed { background: var(--bad); }
.reason { background: var(--feedback); padding: 6px 8px; border-radius: 4px; white-space: pre-wrap; font-size: 12px; margin: 6px 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0 6px; }
.tabs button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 4px 4px 0 0; padding: 2px 10px; cursor: pointer; font: inherit; font-size: 13px; }
.tabs button.on { background: var(--panel); border-bottom-color: var(--panel); font-weight: 600; }
pre { background: var(--code); padding: 10px; border-radius: 4px; white-space: pre-wrap; word-break: break-word; font: 12px/1.45 ui-monospace, "Noto Sans Mono CJK SC", monospace; margin: 0; }
pre mark { background: var(--feedback); color: inherit; }
.unplaced { padding: 8px 16px; background: var(--feedback); font-size: 12px; }
.unplaced li { word-break: break-all; }
#graph svg text { font-size: 11px; fill: var(--ink); }
#graph .edge { fill: none; stroke: var(--muted); stroke-width: 1.2; }
#graph .elabel { font-size: 10px; fill: var(--muted); }
.kv { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>流水线回放</h1>
  <div class="meta" id="meta"></div>
  <table class="summary" id="summary"></table>
</header>
<div id="unplaced"></div>
<div class="controls">
  <button id="prev">◀</button><button id="play">播放</button><button id="next">▶</button>
  <input type="range" id="slider" min="0" value="0">
  <span id="counter"></span>
  <span id="jumps"></span>
  <button id="speed">1×</button>
</div>
<svg id="strip"></svg>
<main>
  <section class="pane" id="dagPane">
    <div class="legend">
      <span style="background:var(--pending)"></span>还没有调用
      <span style="background:var(--ok)"></span>已接受
      <span style="background:var(--warn)"></span>被驳回或重问
      <span style="background:var(--bad)"></span>失败
      <span style="background:none;border:2px solid var(--active)"></span>当前调用
      <span style="background:none;border:1px dashed var(--muted)"></span>这个任务不需要调用模型
    </div>
    <svg id="dag"></svg>
  </section>
  <section class="pane" id="framePane">
    <div id="frame"></div>
  </section>
</main>
<script>
const PAGE = /*PAGE_DATA*/null;
const STAGES = ["L1", "L2", "SEG", "LOOP"];
const STAGE_NAMES = {L1: "第一层压缩（工具调用和结果）", L2: "第二层压缩（整轮）", SEG: "切分用户消息", LOOP: "逐单元抽取"};
const STAGE_COLORS = {L1: "var(--l1)", L2: "var(--l2)", SEG: "var(--seg)", LOOP: "var(--loop)"};
const ASK_NAMES = {call: "压缩工具调用", result: "压缩工具结果", round: "压缩整轮", segment: "切分", topic: "T 归入 topic",
  signal: "A 信号意图", registry: "B 登记意图", aggregate: "G 归入聚合", tool_intent: "L 底层意图", relation: "C 连边",
  outcome: "D 观察结果", outcome_summary: "D 观察结果（摘要）"};
const VERDICT_NAMES = {accepted: "已接受", rejected: "被驳回", failed: "失败"};
const calls = PAGE.calls;
const jobs = PAGE.jobs;
const jobById = Object.fromEntries(jobs.map(j => [j.id, j]));
let current = 0, playing = null, speed = 1, tab = "prompt";

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }
function pretty(text) { try { return JSON.stringify(JSON.parse(text), null, 2); } catch { return text ?? ""; } }
function time(iso) { return iso ? new Date(iso).toLocaleTimeString("zh-CN", {hour12: false}) : "—"; }
function limitOf(c) { return c.ask === "topic" ? PAGE.attempts.topic : PAGE.attempts[c.stage]; }

/* ---------- header ---------- */
document.getElementById("meta").innerHTML =
  `运行目录 ${esc(PAGE.directory)}<br>对话 ${esc(PAGE.merged)}<br>模型 ${esc(PAGE.backend)} / ${esc(PAGE.model)} · ` +
  (PAGE.logged ? "调用来自 calls.jsonl（精确记录）" :
    `旧运行：调用是按模型、system prompt 和对话原文从 llm-home 匹配出来的，时间范围从 ${esc(PAGE.since ? new Date(PAGE.since).toLocaleString("zh-CN", {hour12: false}) : "最早")} 开始`);

(function summary() {
  const rows = {};
  for (const c of calls) {
    const key = c.stage + "|" + c.ask;
    const r = rows[key] ??= {stage: c.stage, ask: c.ask, n: 0, retry: 0, rejected: 0, failed: 0};
    r.n++; if (c.attempt > 1) r.retry++; if (c.verdict === "rejected") r.rejected++; if (c.verdict === "failed") r.failed++;
  }
  const silent = {};
  const called = new Set(calls.map(c => c.subject));
  for (const j of jobs) if (!called.has(j.id)) silent[j.stage] = (silent[j.stage] ?? 0) + 1;
  let html = "<tr><th>阶段</th><th>调用</th><th>次数</th><th>其中重试</th><th>被驳回</th><th>失败</th></tr>";
  let total = 0;
  for (const s of STAGES) {
    for (const r of Object.values(rows).filter(r => r.stage === s)) {
      total += r.n;
      html += `<tr><td>${STAGE_NAMES[s]}</td><td>${ASK_NAMES[r.ask]}</td><td>${r.n}</td><td>${r.retry}</td><td>${r.rejected}</td><td>${r.failed}</td></tr>`;
    }
    if (silent[s]) html += `<tr><td>${STAGE_NAMES[s]}</td><td>没有调用模型的任务</td><td colspan="4">${silent[s]} 个</td></tr>`;
  }
  html += `<tr><th>合计</th><th></th><th>${total}</th><th colspan="3"></th></tr>`;
  document.getElementById("summary").innerHTML = html;
})();

if (PAGE.unplaced.length) {
  document.getElementById("unplaced").innerHTML =
    `<div class="unplaced"><b>${PAGE.unplaced.length} 份同模型的记录落在这次运行的时间范围里，但对不上任何任务</b>（发出它们的代码后来改过，或者它们属于另一次运行）。这些记录没有被猜着填进回放：<ul>` +
    PAGE.unplaced.map(p => `<li>${esc(p)}</li>`).join("") + "</ul></div>";
}

/* ---------- controls ---------- */
const slider = document.getElementById("slider");
slider.max = Math.max(0, calls.length - 1);
slider.oninput = () => show(+slider.value);
document.getElementById("prev").onclick = () => show(current - 1);
document.getElementById("next").onclick = () => show(current + 1);
document.getElementById("play").onclick = togglePlay;
document.getElementById("speed").onclick = e => { speed = speed >= 8 ? 1 : speed * 2; e.target.textContent = speed + "×"; if (playing) { togglePlay(); togglePlay(); } };
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") show(current + 1);
  else if (e.key === "ArrowLeft") show(current - 1);
  else if (e.key === " ") { e.preventDefault(); togglePlay(); }
});
function togglePlay() {
  const btn = document.getElementById("play");
  if (playing) { clearInterval(playing); playing = null; btn.textContent = "播放"; btn.classList.remove("on"); return; }
  btn.textContent = "暂停"; btn.classList.add("on");
  playing = setInterval(() => { if (current >= calls.length - 1) togglePlay(); else show(current + 1); }, 900 / speed);
}
document.getElementById("jumps").innerHTML = STAGES.map(s => {
  const i = calls.findIndex(c => c.stage === s);
  return i < 0 ? "" : `<button data-i="${i}" style="border-color:${STAGE_COLORS[s]}">${s}</button>`;
}).join(" ");
document.getElementById("jumps").onclick = e => { if (e.target.dataset.i) show(+e.target.dataset.i); };

/* ---------- time strip ---------- */
const strip = document.getElementById("strip");
const times = calls.map(c => new Date(c.started ?? c.ended).getTime());
const t0 = Math.min(...times), t1 = Math.max(...times.concat([t0 + 1]));
function stripX(t, w) { return 8 + (t - t0) / (t1 - t0) * (w - 16); }
function drawStrip() {
  const w = strip.clientWidth || 800;
  let svg = "";
  calls.forEach((c, i) => {
    const y = 4 + STAGES.indexOf(c.stage) * 6;
    svg += `<rect x="${stripX(times[i], w).toFixed(1)}" y="${y}" width="2" height="5" fill="${c.verdict === "accepted" ? STAGE_COLORS[c.stage] : c.verdict === "failed" ? "var(--bad)" : "var(--warn)"}"/>`;
  });
  svg += `<line id="cursor" x1="0" x2="0" y1="0" y2="34" stroke="var(--active)" stroke-width="1.5"/>`;
  strip.innerHTML = svg;
}
strip.onclick = e => {
  const w = strip.clientWidth, t = t0 + (e.offsetX - 8) / (w - 16) * (t1 - t0);
  let best = 0; times.forEach((x, i) => { if (Math.abs(x - t) < Math.abs(times[best] - t)) best = i; });
  show(best);
};
window.addEventListener("resize", () => { drawStrip(); show(current); });

/* ---------- DAG ---------- */
const CELL = 13, PER_ROW = 6, COL_W = PER_ROW * CELL + 26, LEFT = 96;
const layout = {};
const bands = {};
(function placeJobs() {
  const first = Math.min(...jobs.map(j => j.column));
  for (const j of jobs) j.column -= first;
  const columns = Math.max(...jobs.map(j => j.column)) + 1;
  let y = 24;
  for (const s of STAGES) {
    const perColumn = {};
    for (const j of jobs.filter(j => j.stage === s)) (perColumn[j.column] ??= []).push(j);
    const rows = Math.max(1, ...Object.values(perColumn).map(list => Math.ceil(list.length / PER_ROW)));
    const w = s === "L2" ? COL_W - 26 : CELL - 3;
    for (const [col, list] of Object.entries(perColumn)) {
      list.forEach((j, k) => {
        layout[j.id] = s === "L2"
          ? {x: LEFT + col * COL_W, y, w, h: 16}
          : {x: LEFT + col * COL_W + (k % PER_ROW) * CELL, y: y + Math.floor(k / PER_ROW) * CELL, w, h: CELL - 3};
      });
    }
    const h = s === "L2" ? 16 : rows * CELL;
    bands[s] = {y, h};
    y += h + 30;
  }
  const svg = document.getElementById("dag");
  svg.setAttribute("width", LEFT + columns * COL_W + 10);
  svg.setAttribute("height", y);
  let html = "";
  for (let col = 0; col < columns; col++) html += `<text x="${LEFT + col * COL_W}" y="12">${col + first === 0 ? "首条消息前" : "第 " + (col + first) + " 轮"}</text>`;
  STAGES.forEach((s, i) => {
    const b = bands[s];
    html += `<text class="band" x="4" y="${b.y + 10}" fill="${STAGE_COLORS[s]}">${s}</text>`;
    if (i > 0) html += `<line class="barrier" x1="4" x2="${LEFT + columns * COL_W}" y1="${b.y - 15}" y2="${b.y - 15}"/><text x="30" y="${b.y - 18}">上一层全部完成后才开始</text>`;
  });
  html += `<g id="edges"></g>`;
  for (const j of jobs) {
    const p = layout[j.id];
    html += `<rect class="node" id="n-${CSS.escape(j.id)}" data-id="${esc(j.id)}" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="2"><title>${esc(j.id + "\n" + j.label)}</title></rect>`;
    if (j.stage === "L2") html += `<text x="${p.x + 3}" y="${p.y + 12}" pointer-events="none" style="fill:#fff">${esc(j.label.slice(0, 9))}</text>`;
  }
  svg.innerHTML = html;
  svg.onclick = e => {
    const id = e.target.dataset?.id; if (!id) return;
    const i = calls.findIndex(c => c.subject === id);
    if (i >= 0) show(i); else showJob(jobById[id]);
  };
})();
const firstCall = {};
calls.forEach((c, i) => { firstCall[c.subject] ??= i; });

function paintDag() {
  const latest = {};
  for (let i = 0; i <= current; i++) latest[calls[i].subject] = calls[i];
  const doneUpTo = calls[current];
  const inFlight = new Set();
  if (doneUpTo.started) {
    const t = new Date(doneUpTo.started).getTime();
    for (const c of calls) if (c.started && new Date(c.started).getTime() <= t && new Date(c.ended).getTime() > t) inFlight.add(c.subject);
  }
  const stageReached = STAGES.indexOf(doneUpTo.stage);
  const unitReached = doneUpTo.stage === "LOOP" ? +doneUpTo.subject.split(":")[1] : -1;
  for (const j of jobs) {
    const el = document.getElementById("n-" + CSS.escape(j.id));
    const c = latest[j.id];
    let fill = "var(--pending)", stroke = "none", dash = "";
    if (c) fill = c.verdict === "accepted" ? STAGE_COLORS[j.stage] : c.verdict === "failed" ? "var(--bad)" : "var(--warn)";
    else if (firstCall[j.id] === undefined) {
      const passed = STAGES.indexOf(j.stage) < stageReached || (j.stage === "LOOP" && +j.id.split(":")[1] < unitReached);
      fill = "none"; stroke = passed ? "var(--muted)" : "var(--pending)"; dash = "2 2";
    }
    if (inFlight.has(j.id)) { stroke = "var(--active)"; dash = "2 1"; }
    if (j.id === doneUpTo.subject) { stroke = "var(--active)"; dash = ""; }
    el.setAttribute("fill", fill); el.setAttribute("stroke", stroke);
    el.setAttribute("stroke-width", j.id === doneUpTo.subject ? 2.5 : 1); el.setAttribute("stroke-dasharray", dash);
  }
  const job = jobById[doneUpTo.subject];
  let edges = "";
  for (const from of job?.after ?? []) {
    const a = layout[from], b = layout[job.id]; if (!a || !b) continue;
    edges += `<path d="M${a.x + a.w / 2},${a.y + a.h} C${a.x + a.w / 2},${(a.y + b.y) / 2} ${b.x + b.w / 2},${(a.y + b.y) / 2} ${b.x + b.w / 2},${b.y}" fill="none" stroke="var(--active)" stroke-width="1.2" marker-end=""/>`;
  }
  document.getElementById("edges").innerHTML = edges;
  const p = layout[doneUpTo.subject], pane = document.getElementById("dagPane");
  if (p && (p.y < pane.scrollTop || p.y > pane.scrollTop + pane.clientHeight - 40)) pane.scrollTop = p.y - pane.clientHeight / 2;
}

/* ---------- frame ---------- */
function show(i) {
  current = Math.max(0, Math.min(calls.length - 1, i));
  slider.value = current;
  const c = calls[current];
  document.getElementById("counter").textContent = `${current + 1} / ${calls.length}`;
  history.replaceState(null, "", `#call=${current + 1}&tab=${tab}`);
  const cur = document.getElementById("cursor");
  if (cur) { const x = stripX(times[current], strip.clientWidth || 800); cur.setAttribute("x1", x); cur.setAttribute("x2", x); }
  paintDag();
  renderFrame(c);
}

function headerOf(prompt) {
  const m = prompt.match(/<header>\n([\s\S]*?)\n<\/header>/);
  if (!m) return null;
  try { return JSON.parse(m[1]); } catch { return null; }
}

function renderFrame(c) {
  const job = jobById[c.subject];
  const header = headerOf(c.prompt);
  const tabs = {prompt: "提示词", reply: "回答", reasoning: "推理", system: "system", schema: "schema", record: "写下的记录", graph: "图谱", usage: "用量"};
  if (!c.reasoning) delete tabs.reasoning;
  if (!header?.graph) delete tabs.graph;
  if (!tabs[tab]) tab = "prompt";
  let body = "";
  if (tab === "prompt") {
    const p = c.prompt, at = c.feedback_at;
    body = `<pre>${at ? esc(p.slice(0, at)) + "<mark>" + esc(p.slice(at)) + "</mark>" : esc(p)}</pre>`;
  } else if (tab === "reply") body = `<pre>${esc(pretty(c.reply ?? "（没有回答）"))}</pre>`;
  else if (tab === "reasoning") body = `<pre>${esc(c.reasoning)}</pre>`;
  else if (tab === "system") body = `<pre>${esc(PAGE.systems[c.ask])}</pre>`;
  else if (tab === "schema") body = `<pre>${esc(JSON.stringify(PAGE.schemas[c.ask], null, 2))}</pre>`;
  else if (tab === "usage") body = `<pre>${esc(JSON.stringify(c.usage, null, 2))}\nfinish: ${esc(c.finish)}\ntranscript: ${esc(c.transcript)}</pre>`;
  else if (tab === "record") body = recordHtml(c, job);
  else if (tab === "graph") body = graphHtml(header);
  const lastOfSubject = calls.findLastIndex(x => x.subject === c.subject);
  document.getElementById("frame").innerHTML =
    `<div class="frame-title"><span class="badge" style="background:${STAGE_COLORS[c.stage]}">${c.stage}</span>${esc(ASK_NAMES[c.ask])} · ${esc(c.subject)}</div>` +
    `<div class="kv">${job ? esc(job.label) + " · " : ""}第 ${c.attempt} 次（最多 ${limitOf(c)} 次）· ` +
    `${c.started ? "开始 " + time(c.started) + " · " : ""}结束 ${time(c.ended)} · ` +
    `这个任务的第 ${calls.slice(0, current + 1).filter(x => x.subject === c.subject).length} 次调用，共 ${calls.filter(x => x.subject === c.subject).length} 次` +
    (lastOfSubject === current ? "（最后一次）" : "") + `</div>` +
    `<div><span class="badge verdict-${c.verdict}">${VERDICT_NAMES[c.verdict]}</span></div>` +
    (c.reason ? `<div class="reason">${c.verdict === "rejected" && c.attempt < limitOf(c) ? "管线把这段反馈附在提示词后面，又问了一次：\n" : ""}${esc(c.reason)}</div>` : "") +
    `<div class="tabs">${Object.entries(tabs).map(([k, v]) => `<button data-tab="${k}" class="${k === tab ? "on" : ""}">${v}</button>`).join("")}</div>` + body;
  document.querySelector("#frame .tabs").onclick = e => { if (e.target.dataset.tab) { tab = e.target.dataset.tab; renderFrame(c); } };
}

function recordHtml(c, job) {
  if (!job) return "<pre>这个调用对应的任务不在当前的记录里。</pre>";
  const note = calls.findLastIndex(x => x.subject === c.subject) === current
    ? "这是这个任务的最后一次调用，下面是任务最终写下的记录。"
    : "这个任务后面还有调用，下面是任务最终写下的记录，不是这一次调用的结果。";
  return `<div class="kv">${note}</div><pre>${esc(JSON.stringify(job.record, null, 2))}</pre>`;
}

function showJob(job) {
  document.getElementById("frame").innerHTML =
    `<div class="frame-title"><span class="badge" style="background:${STAGE_COLORS[job.stage]}">${job.stage}</span>${esc(job.id)}</div>` +
    `<div class="kv">${esc(job.label)} · 这个任务没有调用模型，它的记录直接由代码写出（例如工具结果的 topic 取自它的调用）。</div>` +
    `<pre>${esc(JSON.stringify(job.record, null, 2))}</pre>`;
}

/* ---------- graph from the prompt header ---------- */
function graphHtml(header) {
  const g = header.graph, nodes = Object.entries(g.nodes ?? {}), edges = g.edges ?? [];
  if (!nodes.length) return `<div class="kv">topic ${esc(header.current_topic)} 的图谱目前还是空的。</div><pre>${esc(JSON.stringify(header, null, 2))}</pre>`;
  const kinds = ["intent", "aggregate", "observation"], names = {intent: "意图", aggregate: "聚合", observation: "观察"};
  const colors = {intent: "var(--loop)", aggregate: "var(--l2)", observation: "var(--seg)"};
  const W = 230, H = 34, pos = {};
  const counts = {};
  for (const [id, n] of nodes) { const k = kinds.indexOf(n.type) < 0 ? 0 : kinds.indexOf(n.type); const r = counts[k] = (counts[k] ?? 0) + 1; pos[id] = {x: 10 + k * (W + 40), y: 24 + (r - 1) * (H + 10)}; }
  const height = 40 + Math.max(...Object.values(counts)) * (H + 10);
  const candidates = new Set((header.candidates ?? []).map(x => typeof x === "string" ? x : x.id));
  let svg = kinds.map((k, i) => `<text x="${10 + i * (W + 40)}" y="14" font-weight="600">${names[k]}</text>`).join("");
  for (const e of edges) {
    const a = pos[e.from], b = pos[e.to]; if (!a || !b) continue;
    const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2;
    const same = a.x === b.x;
    const d = same ? `M${a.x + W},${y1} C${a.x + W + 30},${y1} ${b.x + W + 30},${y2} ${b.x + W},${y2}` : `M${x1},${y1} C${(x1 + x2) / 2},${y1} ${(x1 + x2) / 2},${y2} ${x2},${y2}`;
    svg += `<path class="edge" d="${d}"><title>${esc(e.relation + "：" + (e.evidence ?? ""))}</title></path>`;
    svg += `<text class="elabel" x="${same ? a.x + W + 18 : (x1 + x2) / 2 - 14}" y="${(y1 + y2) / 2 - 2}">${esc(e.relation)}</text>`;
  }
  for (const [id, n] of nodes) {
    const p = pos[id], hot = candidates.has(id);
    svg += `<rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="4" fill="var(--panel)" stroke="${colors[n.type] ?? "var(--muted)"}" stroke-width="${hot ? 3 : 1.2}"><title>${esc(id + " " + (n.label ?? n.text ?? ""))}</title></rect>`;
    svg += `<text x="${p.x + 5}" y="${p.y + 13}" font-weight="600">${esc(id)}</text><text x="${p.x + 5}" y="${p.y + 27}">${esc(String(n.label ?? n.text ?? "").slice(0, 17))}</text>`;
  }
  const width = 10 + 3 * (W + 40) + 40;
  return `<div class="kv">topic ${esc(header.current_topic)} 在这次调用时的图谱，读自提示词的 header；粗框是这次调用给出的候选。</div>` +
    `<div id="graph" style="overflow:auto"><svg width="${width}" height="${height}">${svg}</svg></div>`;
}

drawStrip();
const start = new URLSearchParams(location.hash.slice(1));
tab = start.get("tab") ?? tab;
show(+(start.get("call") ?? 1) - 1);
</script>
